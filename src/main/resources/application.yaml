
  spring:
    application:
      name: expense_tracker_api

    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    flyway:
      enabled: true
      baseline-on-migrate: true

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      show-sql: false


